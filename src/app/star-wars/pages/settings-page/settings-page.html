<fieldset class="_settings-fieldset">
  <legend>Opening Crawl</legend>

  <b>Song URL</b>
  <input type="text" [formField]="form.songUrl" />

  <b>Starting Time (s)</b>
  <input type="number" [formField]="form.startingTime" />
</fieldset>

<div class="_actions">
  <button type="button" class="app-cmp-button app-cl-filled" (click)="save()">
    <i class="material-symbols-outlined">save</i> Save
  </button>
  <button type="button" class="app-cmp-button app-cl-warn" (click)="reset()">
    <i class="material-symbols-outlined">history</i> Reset
  </button>
</div>
